name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build for GitHub Pages
        run: npx ng build --base-href /supportdesk-web/

      # GitHub Pages answers unknown paths with 404.html, so serving the app there
      # makes deep links (and page reloads on /tickets/123) keep working.
      - name: Add single-page-app fallback
        run: cp dist/supportdesk-web/browser/index.html dist/supportdesk-web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/supportdesk-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4